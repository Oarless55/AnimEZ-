<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimEZ Admin Panel 🎌</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 40px 0;
        }
        
        header h1 {
            font-size: 48px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 10px;
        }
        
        .tab {
            flex: 1;
            padding: 15px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .tab:hover {
            background: rgba(255,255,255,0.2);
        }
        
        .tab.active {
            background: #e50914;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: rgba(255,255,255,0.9);
            color: #333;
            font-size: 16px;
        }
        
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        
        .btn-primary {
            background: #e50914;
            color: #fff;
        }
        
        .btn-primary:hover {
            background: #f40612;
            transform: translateY(-2px);
        }
        
        .btn-success {
            background: #28a745;
            color: #fff;
        }
        
        .btn-success:hover {
            background: #218838;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(255,255,255,0.15);
            padding: 25px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 48px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 10px;
        }
        
        .stat-label {
            font-size: 16px;
            opacity: 0.9;
        }
        
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .anime-card {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .anime-card:hover {
            transform: translateY(-5px);
        }
        
        .anime-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
        }
        
        .anime-info {
            padding: 15px;
        }
        
        .anime-title {
            font-weight: 600;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .log-container {
            background: #000;
            color: #0f0;
            padding: 20px;
            border-radius: 10px;
            height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        
        .log-entry {
            margin-bottom: 5px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
        }
        
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎌 AnimEZ Admin Panel</h1>
            <p>Seicode API ile Anime Yönetimi</p>
        </header>
        
        <!-- İstatistikler -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalAnimes">0</div>
                <div class="stat-label">📚 Toplam Anime</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalEpisodes">0</div>
                <div class="stat-label">🎬 Toplam Bölüm</div>
            </div>
        </div>
        
        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab('import')">📥 İçe Aktar</button>
            <button class="tab" onclick="switchTab('browse')">🔍 Anime Ara</button>
            <button class="tab" onclick="switchTab('manage')">⚙️ Yönet</button>
            <button class="tab" onclick="switchTab('logs')">📜 Loglar</button>
        </div>
        
        <!-- İçe Aktarma Tab -->
        <div id="importTab" class="tab-content active">
            <div class="card">
                <h2>📥 Tek Anime İçe Aktar</h2>
                <div class="form-group">
                    <label>Anime Slug:</label>
                    <input type="text" id="animeSlug" placeholder="horimiya">
                    <small style="opacity: 0.7; display: block; margin-top: 5px;">
                        Örnek: horimiya, naruto, one-piece
                    </small>
                </div>
                <button class="btn btn-primary" onclick="importSingleAnime()">
                    📥 İçe Aktar
                </button>
            </div>
            
            <div class="card">
                <h2>📦 Toplu İçe Aktarma</h2>
                <div class="form-group">
                    <label>Sayfa:</label>
                    <input type="number" id="bulkPage" value="1" min="1">
                </div>
                <div class="form-group">
                    <label>Limit:</label>
                    <input type="number" id="bulkLimit" value="10" min="1" max="50">
                </div>
                <button class="btn btn-success" onclick="importBulk()">
                    📦 Toplu İçe Aktar
                </button>
            </div>
        </div>
        
        <!-- Anime Arama Tab -->
        <div id="browseTab" class="tab-content">
            <div class="card">
                <h2>🔍 Seicode'dan Anime Ara</h2>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="loadSeicodeAnimes(1)">
                        Sayfa 1
                    </button>
                    <button class="btn btn-primary" onclick="loadSeicodeAnimes(2)">
                        Sayfa 2
                    </button>
                    <button class="btn btn-primary" onclick="loadSeicodeAnimes(3)">
                        Sayfa 3
                    </button>
                </div>
                <div id="seicodeAnimeGrid" class="anime-grid"></div>
            </div>
        </div>
        
        <!-- Yönetim Tab -->
        <div id="manageTab" class="tab-content">
            <div class="card">
                <h2>⚙️ Veritabanındaki Animeler</h2>
                <button class="btn btn-primary" onclick="loadLocalAnimes()">
                    🔄 Yenile
                </button>
                <div id="localAnimeGrid" class="anime-grid"></div>
            </div>
        </div>
        
        <!-- Loglar Tab -->
        <div id="logsTab" class="tab-content">
            <div class="card">
                <h2>📜 İşlem Logları</h2>
                <div class="log-container" id="logContainer"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000';
        
        // Tab değiştirme
        function switchTab(tabName) {
            const tabs = document.querySelectorAll('.tab');
            const contents = document.querySelectorAll('.tab-content');
            
            tabs.forEach(tab => tab.classList.remove('active'));
            contents.forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabName + 'Tab').classList.add('active');
        }
        
        // Log ekleme
        function log(message, type = 'info') {
            const logContainer = document.getElementById('logContainer');
            const emoji = type === 'success' ? '✅' : type === 'error' ? '❌' : '📌';
            const time = new Date().toLocaleTimeString();
            logContainer.innerHTML += `<div class="log-entry">[${time}] ${emoji} ${message}</div>`;
            logContainer.scrollTop = logContainer.scrollHeight;
        }
        
        // İstatistikleri yükle
        async function loadStats() {
            try {
                const response = await fetch(`${API_URL}/api/admin/stats`);
                const stats = await response.json();
                
                document.getElementById('totalAnimes').textContent = stats.total_animes;
                document.getElementById('totalEpisodes').textContent = stats.total_episodes;
            } catch (error) {
                console.error('Stats yüklenemedi:', error);
            }
        }
        
        // Tek anime içe aktar
        async function importSingleAnime() {
            const slug = document.getElementById('animeSlug').value.trim();
            
            if (!slug) {
                alert('Lütfen anime slug girin!');
                return;
            }
            
            log(`İçe aktarma başlatıldı: ${slug}`);
            
            try {
                const response = await fetch(`${API_URL}/api/admin/import/anime`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ slug })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    log(`${result.anime_title} başarıyla eklendi! (${result.episodes_added} bölüm)`, 'success');
                    loadStats();
                } else {
                    log(`Hata: ${result.error}`, 'error');
                }
            } catch (error) {
                log(`API Hatası: ${error.message}`, 'error');
            }
        }
        
        // Toplu içe aktarma
        async function importBulk() {
            const page = document.getElementById('bulkPage').value;
            const limit = document.getElementById('bulkLimit').value;
            
            log(`Toplu içe aktarma başlatıldı (Sayfa: ${page}, Limit: ${limit})`);
            
            try {
                const response = await fetch(`${API_URL}/api/admin/import/bulk`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ page: parseInt(page), limit: parseInt(limit) })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    log(`Tamamlandı! Başarılı: ${result.successful}, Başarısız: ${result.failed}`, 'success');
                    loadStats();
                } else {
                    log(`Hata: ${result.error}`, 'error');
                }
            } catch (error) {
                log(`API Hatası: ${error.message}`, 'error');
            }
        }
        
        // Seicode'dan animeleri yükle
        async function loadSeicodeAnimes(page = 1) {
            const grid = document.getElementById('seicodeAnimeGrid');
            grid.innerHTML = '<div class="loading"><div class="spinner"></div><p>Yükleniyor...</p></div>';
            
            try {
                const response = await fetch(`${API_URL}/api/admin/seicode/list?page=${page}&limit=20`);
                const result = await response.json();
                
                if (result.success && result.data.data) {
                    grid.innerHTML = '';
                    result.data.data.forEach(anime => {
                        const card = document.createElement('div');
                        card.className = 'anime-card';
                        card.onclick = () => importAnimeFromCard(anime.slug);
                        card.innerHTML = `
                            <img src="${anime.image || 'https://via.placeholder.com/200x280'}" alt="${anime.title}">
                            <div class="anime-info">
                                <div class="anime-title">${anime.title}</div>
                                <small>${anime.slug}</small>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                }
            } catch (error) {
                grid.innerHTML = '<p>Anime listesi yüklenemedi!</p>';
                log(`Hata: ${error.message}`, 'error');
            }
        }
        
        // Karttan anime içe aktar
        async function importAnimeFromCard(slug) {
            if (confirm(`${slug} animesini içe aktarmak istiyor musunuz?`)) {
                document.getElementById('animeSlug').value = slug;
                switchTab('import');
                await importSingleAnime();
            }
        }
        
        // Yerel animeleri yükle
        async function loadLocalAnimes() {
            const grid = document.getElementById('localAnimeGrid');
            grid.innerHTML = '<div class="loading"><div class="spinner"></div><p>Yükleniyor...</p></div>';
            
            try {
                const response = await fetch(`${API_URL}/api/animes`);
                const animes = await response.json();
                
                grid.innerHTML = '';
                animes.forEach(anime => {
                    const card = document.createElement('div');
                    card.className = 'anime-card';
                    card.innerHTML = `
                        <img src="${anime.image_url || 'https://via.placeholder.com/200x280'}" alt="${anime.title}">
                        <div class="anime-info">
                            <div class="anime-title">${anime.title}</div>
                            <small>⭐ ${anime.rating || 'N/A'} | ${anime.year || 'N/A'}</small>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                grid.innerHTML = '<p>Animeler yüklenemedi!</p>';
            }
        }
        
        // Sayfa yüklendiğinde
        loadStats();
        log('Admin Panel hazır! 🎌');
    </script>
</body>
</html>
