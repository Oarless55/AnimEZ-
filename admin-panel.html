<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - AnimEZ</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background:  linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #fff;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap:  wrap;
        }

        .tab-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .tab-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: white;
            color: #667eea;
            font-weight: bold;
        }

        /* Tab Content */
        .tab-content {
            display: none;
            background: white;
            padding:  30px;
            border-radius:  12px;
            box-shadow:  0 10px 30px rgba(0,0,0,0.2);
        }

        .tab-content.active {
            display: block;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight:  600;
            color: #333;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border 0.3s;
        }

        input:focus, textarea: focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button[type="submit"] {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius:  8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button[type="submit"]:hover {
            transform:  translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }

        /* Result Display */
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .result-item {
            padding: 10px;
            margin:  5px 0;
            border-radius: 5px;
            background: #f0f0f0;
        }

        .result-item.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .result-item.error {
            background: #f8d7da;
            color:  #721c24;
            border: 1px solid #f5c6cb;
        }

        .helper-text {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        .divider {
            height: 1px;
            background: #e0e0e0;
            margin: 30px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 AnimEZ Admin Panel</h1>
        
        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('anime')">➕ Anime Ekle</button>
            <button class="tab-btn" onclick="switchTab('season')">📺 Sezon Ekle</button>
            <button class="tab-btn" onclick="switchTab('episode')">🎞️ Bölüm Ekle</button>
            <button class="tab-btn" onclick="switchTab('video')">▶️ Video Kaynağı Ekle</button>
            <button class="tab-btn" onclick="switchTab('fansub')">🔰 Fansub Ekle</button>
        </div>

        <!-- Anime Ekleme Tab -->
        <div id="anime-tab" class="tab-content active">
            <h2>➕ Yeni Anime Ekle</h2>
            <form id="addAnimeForm">
                <div class="form-group">
                    <label>Anime Adı *</label>
                    <input type="text" id="animeTitle" required>
                </div>
                
                <div class="form-group">
                    <label>Orijinal Adı</label>
                    <input type="text" id="animeOriginalTitle">
                </div>
                
                <div class="form-group">
                    <label>Yıl *</label>
                    <input type="number" id="animeYear" required min="1900" max="2030">
                </div>
                
                <div class="form-group">
                    <label>Türler *</label>
                    <input type="text" id="animeGenres" required placeholder="Action, Comedy, Drama">
                    <div class="helper-text">Virgülle ayırın</div>
                </div>
                
                <div class="form-group">
                    <label>Stüdyo</label>
                    <input type="text" id="animeStudio">
                </div>
                
                <div class="form-group">
                    <label>Rating (0-10)</label>
                    <input type="number" id="animeRating" step="0.1" min="0" max="10">
                </div>
                
                <div class="form-group">
                    <label>Açıklama</label>
                    <textarea id="animeDescription"></textarea>
                </div>
                
                <div class="form-group">
                    <label>Poster URL</label>
                    <input type="url" id="animePoster">
                </div>
                
                <div class="form-group">
                    <label>Arkaplan URL</label>
                    <input type="url" id="animeBackground">
                </div>
                
                <button type="submit">Anime Ekle</button>
                <div id="animeResult" class="result"></div>
            </form>
        </div>

        <!-- Sezon Ekleme Tab -->
        <div id="season-tab" class="tab-content">
            <h2>📺 Sezon Ekle</h2>
            <form id="addSeasonForm">
                <div class="form-group">
                    <label>Anime ID *</label>
                    <input type="number" id="seasonAnimeId" required>
                    <div class="helper-text">Anime ekledikten sonra aldığınız ID</div>
                </div>
                
                <button type="submit">Sezon(lar) Ekle</button>
                <div id="seasonResult" class="result"></div>
            </form>
        </div>

        <!-- Bölüm Ekleme Tab -->
        <div id="episode-tab" class="tab-content">
            <h2>🎞️ Bölüm Ekle</h2>
            <form id="addEpisodeForm">
                <div class="form-group">
                    <label>Sezon ID *</label>
                    <input type="number" id="episodeSeasonId" required>
                </div>
                
                <div class="form-group">
                    <label>Bölüm Numarası *</label>
                    <input type="number" id="episodeNumber" required min="1">
                </div>
                
                <div class="form-group">
                    <label>Bölüm Başlığı *</label>
                    <input type="text" id="episodeTitle" required>
                </div>
                
                <div class="form-group">
                    <label>Açıklama</label>
                    <textarea id="episodeDescription"></textarea>
                </div>
                
                <div class="form-group">
                    <label>Thumbnail URL</label>
                    <input type="url" id="episodeThumbnail">
                </div>
                
                <div class="form-group">
                    <label>Yayın Tarihi</label>
                    <input type="date" id="episodeDate">
                </div>
                
                <button type="submit">Bölüm Ekle</button>
                <div id="episodeResult" class="result"></div>
            </form>
        </div>

        <!-- Video Kaynağı Ekleme Tab -->
        <div id="video-tab" class="tab-content">
            <h2>▶️ Video Kaynağı Ekle</h2>
            <form id="addVideoForm">
                <div class="form-group">
                    <label>Bölüm ID *</label>
                    <input type="number" id="videoEpisodeId" required>
                </div>
                
                <div class="form-group">
                    <label>Fansub ID *</label>
                    <input type="number" id="videoFansubId" required>
                </div>
                
                <div class="divider"></div>
                <h3>Video Kaynakları</h3>
                
                <div class="form-group">
                    <label>VidMoly URL</label>
                    <input type="url" id="videoVidmoly" placeholder="https://vidmoly.to/embed-xxx.html">
                </div>
                
                <div class="form-group">
                    <label>Filemoon URL</label>
                    <input type="url" id="videoFilemoon" placeholder="https://filemoon.sx/e/xxx">
                </div>
                
                <div class="form-group">
                    <label>Mail. ru URL</label>
                    <input type="url" id="videoMailru" placeholder="https://my.mail.ru/video/embed/xxx">
                </div>
                
                <div class="form-group">
                    <label>Sibnet URL</label>
                    <input type="url" id="videoSibnet" placeholder="https://video.sibnet.ru/shell.php?videoid=xxx">
                </div>
                
                <button type="submit">Video Kaynakları Ekle</button>
                <div id="videoResult" class="result"></div>
            </form>
        </div>

        <!-- Fansub Ekleme Tab -->
        <div id="fansub-tab" class="tab-content">
            <h2>🔰 Fansub Ekle</h2>
            <form id="addFansubForm">
                <div class="form-group">
                    <label>Fansub Adı *</label>
                    <input type="text" id="fansubName" required placeholder="Örn:  TurkAnime">
                </div>
                
                <div class="form-group">
                    <label>Credits</label>
                    <textarea id="fansubCredits" placeholder="Çevirmen, Editör vb."></textarea>
                </div>
                
                <div class="form-group">
                    <label>Discord Link</label>
                    <input type="url" id="fansubDiscord" placeholder="https://discord.gg/xxx">
                </div>
                
                <div class="form-group">
                    <label>İkon Emoji</label>
                    <input type="text" id="fansubIcon" placeholder="🔰" maxlength="2">
                </div>
                
                <div class="form-group">
                    <label>Rating (0-10)</label>
                    <input type="number" id="fansubRating" step="0.1" min="0" max="10" value="8.0">
                </div>
                
                <button type="submit">Fansub Ekle</button>
                <div id="fansubResult" class="result"></div>
            </form>
        </div>
    </div>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Önce supabase-client.js sonra admin-panel.js yükle -->
    <script>
        // Supabase yüklenene kadar bekle
        window.addEventListener('load', function() {
            const script1 = document.createElement('script');
            script1.src = 'supabase-client.js';
            script1.onload = function() {
                const script2 = document.createElement('script');
                script2.src = 'admin-panel.js';
                document.body.appendChild(script2);
            };
            document.body.appendChild(script1);
        });
    </script>
</body>
</html>
